<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: app móvil de una sola columna con barra superior y barra inferior de 4 vistas (Pantalla, Tema, Imágenes, Exportar); el editor y la distribución son pantallas propias con «volver». En escritorio las vistas pasan a dos columnas y la navegación sube a la barra superior. Estilo heredado de Noticiahz. */
:root{
  --bg:#f4f6fa;--card:#fff;--bd:#e1e6ee;--bd2:#cfd6e1;--tx:#101827;--mu:#5a6578;
  --em:#047857;--em2:#059669;--tint:#e7f5ee;--onem:#fff;--lg:#22395a;
  --info:#2747a8;--infobg:#e9eefc;--warn:#8a5205;--warnbg:#fbf1df;--bad:#b42318;--badbg:#fdecea;
  --scr:#030406;--scrbd:#1d232d;--ck1:#0c1119;--ck2:#161d29;
  --sh:0 1px 2px #0f172a0d,0 14px 32px -22px #0f172a66;
  --f-ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:Newsreader,Georgia,"Times New Roman",serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ab:56px;--nav:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1523;--card:#152033;--bd:#243249;--bd2:#31425f;--tx:#e8eef7;--mu:#98a8bd;
  --em:#3ddc9a;--em2:#18c488;--tint:#18c48826;--onem:#05140e;--lg:#a9bfdc;
  --info:#a8bcff;--infobg:#a8bcff1f;--warn:#f5b75c;--warnbg:#f5b75c1c;--bad:#ff8a7a;--badbg:#ff8a7a1c;
  --scrbd:#2a3954;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1523;--card:#152033;--bd:#243249;--bd2:#31425f;--tx:#e8eef7;--mu:#98a8bd;
  --em:#3ddc9a;--em2:#18c488;--tint:#18c48826;--onem:#05140e;--lg:#a9bfdc;
  --info:#a8bcff;--infobg:#a8bcff1f;--warn:#f5b75c;--warnbg:#f5b75c1c;--bad:#ff8a7a;--badbg:#ff8a7a1c;
  --scrbd:#2a3954;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--f-ui);background:var(--bg);color:var(--tx);min-height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;touch-action:manipulation}
select{color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
:focus-visible{outline:2px solid var(--em2);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2{font:600 21px/1.2 var(--f-disp);letter-spacing:-.005em;text-wrap:balance}
h3{font:600 15.5px/1.3 var(--f-ui);letter-spacing:-.01em}
.note{font-size:13px;color:var(--mu);line-height:1.45}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mu)}
code{font:12.5px var(--f-mono);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}

/* barra superior */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.ab-in{height:var(--ab);display:flex;align-items:center;gap:4px;max-width:1240px;margin:0 auto;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.ab-t{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-left:8px}
.ab-back+.ab-t{padding-left:0}
.ab-t .t1{font:600 19px/1.15 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-t .t2{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-t .t2.mono{font-family:var(--f-mono);font-size:11.5px}
.lw{font:600 12.5px/1 var(--f-ui);letter-spacing:-.02em;color:var(--lg)}.lw em{font-style:normal;color:var(--em2)}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mu);flex:none;position:relative}
.ib:hover{color:var(--em);background:var(--tint)}
.ib:disabled{opacity:.35;pointer-events:none}
.ib[aria-pressed="true"]{color:var(--em);background:var(--tint)}
.ib.bd{border:1px solid var(--bd);background:var(--card)}
.tnav{display:none}
/* barra inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav);font-size:11.5px;font-weight:600;color:var(--mu);position:relative}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="page"]{color:var(--em)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--em2)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--em);color:var(--onem);font-size:10.5px;font-weight:700;border-radius:99px;padding:0 6px;line-height:17px;font-variant-numeric:tabular-nums}
body[data-route="edit"] .bnav,body[data-route="layout"] .bnav,body[data-route="gen"] .bnav{display:none}

#view{max-width:1240px;margin:0 auto;padding-top:14px;padding-bottom:calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body[data-route="edit"] #view,body[data-route="layout"] #view{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
body[data-route="gen"] #view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.acc{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.acc-i+.acc-i{border-top:1px solid var(--bd)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;min-height:64px;text-align:left}
.acc-h .ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--tint);color:var(--em)}
.acc-h .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.acc-h .tx b{font-size:15px;font-weight:600}.acc-h .tx small{font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-h .ch{color:var(--mu);width:18px;height:18px;transition:transform .15s}.acc-i.open .acc-h .ch{transform:rotate(90deg)}
.acc-i.open .acc-h{background:color-mix(in srgb,var(--tint) 60%,transparent)}
.acc-b{padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px}
.ocg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ocd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 7px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);font-size:12.5px;font-weight:600;color:var(--mu);min-width:0}
.ocd canvas{width:100%;max-width:120px;height:auto;aspect-ratio:210/137;border-radius:6px;background:#000}
.ocd[aria-pressed="true"]{border-color:var(--em2);background:var(--tint);color:var(--em);box-shadow:0 0 0 1px var(--em2)}
.list .li .th canvas{width:100%;height:auto}
.gsh{display:flex;flex-direction:column;gap:8px;position:sticky;top:-10px;z-index:3;background:var(--card);margin-top:-4px;padding-block:4px 10px;border-bottom:1px solid var(--bd)}
.gsh .screen{padding:5px;border-radius:12px}.gsh .screen canvas{cursor:pointer}
.gsh h2{font-size:19px}.gsh .seg{flex:0 0 auto}.gsh .seg button{min-height:36px;padding:4px 12px}
.gpair{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#000;border-radius:14px;padding:8px}
.gpair canvas{width:100%;height:auto;aspect-ratio:210/137;display:block;border-radius:6px}
.gnav{display:flex;gap:8px;position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--card);padding-block:10px 4px}
.gnav .btn{flex:1}
.logo{display:inline-flex;align-items:center;gap:8px}.logo .lgi{width:34px;height:34px;flex:none}.logo .lw{font:600 24px/1 var(--f-ui);letter-spacing:-.04em}
.lp{width:42px;height:23px;fill:none;stroke:var(--em2);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;margin-left:-2px;flex:none}
.abt{text-align:center;margin:10px 0 4px;display:flex;flex-direction:column;gap:3px;align-items:center}.abt .logo{margin-bottom:6px}.abt>span{font-size:13px;color:var(--mu)}
.abt strong{color:var(--em);font-weight:700;letter-spacing:.02em}.abt-b{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.chgl{max-height:60dvh;overflow-y:auto;margin:0 0 14px}.chgl section{padding:10px 0;border-bottom:1px solid var(--bd)}.chgl section:last-child{border-bottom:0}
.chgl h4{margin:0 0 6px;font:600 14px var(--f-ui)}.chgl h4 small{color:var(--em);font-weight:600}.chgl ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.45}.chgl li{margin:3px 0}
.chgl a{color:var(--em)}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--ab) + 8px + env(safe-area-inset-top,0px));z-index:55;width:min(520px,calc(100% - 24px));background:var(--card);border:1px solid var(--em2);border-radius:16px;box-shadow:0 12px 32px -12px #0006;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px}
.upd-t{flex:1;min-width:0;display:flex;flex-direction:column}.upd-t b{font-size:14px}.upd-t small{font-size:12px;color:var(--mu)}
.cfm{display:flex;gap:10px;margin-top:4px}.cfm .btn{flex:1}
.btn.dgf{background:var(--bad);border-color:var(--bad);color:#fff}.btn.dgf:hover{filter:brightness(1.08);background:var(--bad)}
.hl{display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.hx{padding:12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}.hx:first-child{border-top:0}
.hx-h .tx{display:flex;flex-direction:column}.hx-h b{font-size:14.5px}.hx-h small{font-size:12.5px;color:var(--mu)}
.hx-a{display:flex;flex-wrap:wrap;gap:6px}
.hx details summary{font-size:13px;font-weight:600;color:var(--em);cursor:pointer}
.hx-f{display:flex;flex-direction:column;gap:2px;padding-top:6px;font:11.5px var(--f-mono);color:var(--mu);overflow-wrap:anywhere}
@media not ((min-width:900px) and (hover:hover) and (pointer:fine)){body.pv-s .sticky-pv .screen,body.pv-s .gsh .screen{width:66%;margin-inline:auto}body.pv-l .sticky-pv{margin-inline:-16px;padding-inline:4px}}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.icb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);font-size:11.5px;font-weight:600;color:var(--mu);min-width:0}
.icb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icb canvas{width:44px;height:44px}
.icb[aria-pressed="true"]{border-color:var(--em2);background:var(--tint);color:var(--em)}
.gbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:10px;background:var(--card);border-top:1px solid var(--bd);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gbar .btn{flex:1}.gbar .btn.o{flex:0 1 auto}
body[data-route="gen"] .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* piezas comunes */
.btn{text-decoration:none;text-align:center;background:var(--em);color:var(--onem);padding:11px 18px;min-height:46px;border-radius:14px;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--em);white-space:nowrap}

    if(root===null)root=segs[i-1]||'M1';const rel=segs.slice(i).join('/');

  files.sort((a,b)=>(SECO.get(a.sec)-SECO.get(b.sec))||a.lc.localeCompare(b.lc));
  Object.assign(S,{files,lc:new Map(files.map(f=>[f.lc,f])),root,demo:!!opts.demo,png,errs,bkName:opts.name||null,bkT:opts.t||Date.now(),ops:{global:null,sec:{},file:{}},ex:{},frames:{},layout:null,src:new Map(),scope:'global',sel:0,famOpen:null,gen:null,genCv:null});

  return true;
}

function paintRange(inp){const mn=+inp.min,mx=+inp.max,v=+inp.value;if(inp.classList.contains('hue'))return;

  for(const t of tg){const dx=t*fw,iw=src.bmp.width,ih=src.bmp.height;x.clearRect(dx,0,fw,F.h);
    if(src.fit==='stretch')x.drawImage(src.bmp,dx,0,fw,F.h);
    else if(src.fit==='contain'){const s=Math.min(fw/iw,F.h/ih),w=iw*s,h=ih*s;x.drawImage(src.bmp,dx+(fw-w)/2,(F.h-h)/2,w,h)}

}

function check(F){

  if(b.w!==F.w||b.h!==F.h)msgs.push(`Tamaño distinto: ${b.w}×${b.h} en vez de ${F.w}×${F.h}`);
  let k=0;for(let i=0;i<b.idx.length;i++){const p=b.idx[i]*3;if(b.pal[p]===255&&b.pal[p+1]===255&&b.pal[p+2]===0)k++}
  if(F.keyCount&&!k)msgs.push('Ya no tiene zonas transparentes; el original sí las tenía.');
  if(!F.keyCount&&k)msgs.push('Ahora tiene amarillo puro, que el MediaNav muestra transparente.');
  if(F.keyCount&&k&&Math.abs(k-F.keyCount)/F.keyCount>.25)msgs.push(`La zona transparente cambia mucho (${Math.round(k*100/(F.w*F.h))} % frente a ${Math.round(F.keyCount*100/(F.w*F.h))} %).`);
  return {u,ok:!msgs.length,msgs,kind:F.rep?'Imagen nueva':'Color'};
}

/* ============ kit de prueba ============ */
async function makeKit(){
  if(S.demo){toast('Carga primero tu backup');openLoad();return}
  const navi=byName('home/home_navi_btn.bmp'),radio=byName('home/home_radio_btn.bmp'),bg=byName('common/home_bg.bmp');
  if(!navi||!radio||!bg){toast('Tu backup no tiene los archivos que usa la prueba',{ms:5000});return}
  toast('Preparando el kit…');
  const tileKit=(F,key)=>{const fr=frames(F),fw=F.w/fr,c=document.createElement('canvas');c.width=F.w;c.height=F.h;const x=c.getContext('2d');const cols=['#1d4ed8','#15803d','#52525b','#c2410c'];
    for(let s=0;s<fr;s++){const ox=s*fw;x.fillStyle=cols[s%4];x.fillRect(ox,0,fw,F.h);x.strokeStyle='#ffffff';x.lineWidth=3;x.strokeRect(ox+6,6,fw-12,F.h-12);
      x.fillStyle='#ffffff';x.textAlign='center';x.textBaseline='middle';x.font='bold 70px sans-serif';x.fillText(String(s+1),ox+fw/2,F.h*.45);x.font='bold 15px sans-serif';x.fillText('ESTADO '+(s+1),ox+fw/2,F.h-24)}
    const im=x.getImageData(0,0,F.w,F.h),R=30,key8=new Uint8Array(F.w*F.h);
    if(key)for(let s=0;s<fr;s++)for(let y=0;y<F.h;y++)for(let xx=0;xx<fw;xx++){const dx=xx<R?R-xx:xx>fw-1-R?xx-(fw-1-R):0,dy=y<R?R-y:y>F.h-1-R?y-(F.h-1-R):0;if(dx&&dy&&dx*dx+dy*dy>R*R){const i=y*F.w+s*fw+xx;key8[i]=1}}
    const q=quantize(im.data,F.w,F.h,{key:key8,dither:false});return new Uint8Array(encodeBMP8(F.w,F.h,q.idx,q.pal,F))};
  const bgKit=F=>{const c=document.createElement('canvas');c.width=F.w;c.height=F.h;const x=c.getContext('2d');x.fillStyle='#05070b';x.fillRect(0,0,F.w,F.h);
    for(let v=0;v<=800;v+=20){x.fillStyle=v%100?'#1b2433':'#3e5274';x.fillRect(v,0,v%100?1:2,480)}for(let v=0;v<=480;v+=20){x.fillStyle=v%100?'#1b2433':'#3e5274';x.fillRect(0,v,800,v%100?1:2)}
    x.fillStyle='#e8eef7';x.font='bold 15px sans-serif';x.textBaseline='top';for(let v=100;v<800;v+=100)x.fillText(String(v),v+4,82);x.textBaseline='middle';for(let v=100;v<480;v+=100)x.fillText(String(v),6,v-9);
    x.strokeStyle='#f5b75c';x.lineWidth=2;x.beginPath();x.moveTo(400,0);x.lineTo(400,480);x.moveTo(0,240);x.lineTo(800,240);x.stroke();
    x.fillStyle='#f5b75c';x.textAlign='center';x.font='bold 16px sans-serif';x.fillText('PRUEBA SKINHZ · haz una foto de frente',400,462);
    const im=x.getImageData(0,0,F.w,F.h),q=quantize(im.data,F.w,F.h,{key:null,dither:false});return new Uint8Array(encodeBMP8(F.w,F.h,q.idx,q.pal,F))};
  const R=S.root,files=[[navi,tileKit(navi,true)],[radio,tileKit(radio,false)],[bg,bgKit(bg)]];
  for(const [F,u] of files){const b=parseBMP(u.buffer);if(b.w!==F.w||b.h!==F.h){toast('Error al preparar el kit');return}}
  const txt=[`Kit de prueba de Mediaskinhz · backup ${R}`,'','Cambia 3 imágenes para responder 4 preguntas con una sola prueba en el coche:','',
    `1. Navegación (${R}/${navi.path}): tiene las esquinas en amarillo de transparencia.`,'   ¿Las esquinas se ven transparentes (se ve el fondo) o amarillas?','',
    `2. Radio (${R}/${radio.path}): igual pero sin transparencia. Sirve de comparación.`,'   ¿Qué número se ve en reposo? ¿Y mientras lo mantienes pulsado?','',
    `3. Fondo de Inicio (${R}/${bg.path}): una regla con líneas cada 20 px y números cada 100 px.`,'   Haz una foto de la pantalla de Inicio de frente: con ella se calculan las posiciones reales de los botones.','',
    '4. Si la radio arranca y muestra las tres imágenes, acepta las paletas de 256 colores que usa Mediaskinhz al sustituir imágenes.','',
    'Instalación: descomprime en la raíz del USB, entra con Total Commander y copia la carpeta '+R+' encima de la del equipo (en muchos equipos \\Storage Card\\System\\Img\\'+R+'). Reinicia.',
    'Para dejarlo como estaba: copia igual ORIGINALES\\'+R+'.'].join('\r\n');
  const ents=[...files.map(([F,u])=>({name:R+'/'+F.path,data:u})),...files.map(([F])=>({name:'ORIGINALES/'+R+'/'+F.path,data:new Uint8Array(F.buf)})),{name:'LEEME_PRUEBA.txt',data:new TextEncoder().encode(txt)}];
  await saveBlob(await makeZip(ents),'mediaskinhz-kit-de-prueba.zip');
}

const SETDEF={confirm:true,auto:true,xboot:true,xmode:'auto',xhw:2,xorig:true,pv:'m',theme:'auto'};

function loadSet(){try{SET={...SETDEF,...JSON.parse(localStorage.getItem('skinhz-set')||'{}')}}catch(_){SET={...SETDEF}}
  if(S.xmode===undefined)S.xmode=SET.xmode;if(S.xhw===undefined)S.xhw=SET.xhw;applySetUI()}
function saveSet(){try{localStorage.setItem('skinhz-set',JSON.stringify(SET))}catch(_){}applySetUI()}
function applySetUI(){document.body.classList.toggle('pv-s',SET.pv==='s');document.body.classList.toggle('pv-l',SET.pv==='l')}
function confirmBS(o){return new Promise(res=>{
  if(!SET.confirm&&!o.always){res(true);return}
  openBS(`<h2>${o.title}</h2><p>${o.text}</p>${o.extra||''}<div class="cfm"><button class="btn o" data-c="0">${o.cancel||'Cancelar'}</button><button class="btn${o.danger?' dgf':''}" data-c="1">${o.ok}</button></div>`);
  S.bsCancel=()=>res(false);
  $('#bs').onclick=e=>{const x=e.target.closest('[data-c]');if(!x)return;S.bsCancel=null;closeBS();res(x.dataset.c==='1')}})}
const sig=()=>S.root+':'+S.files.length;
async function getList(k){try{return (await idb.get(k))||[]}catch(_){return []}}
/* ---- Diseños y copias: un registro por diseño ('pt:<id>') y un índice pequeño ('ptidx') con lo que se enseña en la lista.
   Borrar quita primero el registro (libera espacio aunque el navegador esté lleno) y guardar no reescribe los demás.
   Se guardan todos los diseños con nombre y, como mucho, las 10 últimas copias automáticas y las 10 de exportación. */
const PT={idx:null},PTKEEP=10;
const ptMeta=p=>({id:p.id,t:p.t,label:p.label,kind:p.kind,sig:p.sig,n:p.n,thumb:p.thumb||null});
async function ptIndex(){if(PT.idx)return PT.idx;let ix=null;try{ix=await idb.get('ptidx')}catch(_){}
  if(!Array.isArray(ix)){ix=[];let old=null;try{old=await idb.get('points')}catch(_){}   // de la versión anterior: todos juntos en 'points'
    if(Array.isArray(old))for(const p of old){try{await idb.set('pt:'+p.id,p);ix.push(ptMeta(p))}catch(_){}}
    try{await idb.set('ptidx',ix);if(old)await idb.del('points')}catch(_){}}
  PT.idx=ix;return ix}
const listPoints=async()=>[...await ptIndex()];
async function getPoint(id){try{return await idb.get('pt:'+id)}catch(_){return null}}
async function putPoint(p){await ptIndex();await idb.set('pt:'+p.id,p);const m=ptMeta(p),i=PT.idx.findIndex(x=>x.id===p.id);if(i>=0)PT.idx[i]=m;else PT.idx.unshift(m);await idb.set('ptidx',PT.idx)}
async function delPoint(id){await ptIndex();try{await idb.del('pt:'+id)}catch(_){}PT.idx=PT.idx.filter(x=>x.id!==id);await idb.set('ptidx',PT.idx)}
async function prunePoints(){const ix=await ptIndex();for(const k of ['auto','export']){const L=ix.filter(x=>x.kind===k).sort((a,b)=>b.t-a.t).slice(PTKEEP);for(const x of L)await delPoint(x.id).catch(()=>{})}}
const noSpace=()=>toast('No queda espacio en el navegador. Borra copias automáticas o diseños que no uses (⋯ → Mis diseños).',{ms:7000});
// Datos de los botones para guardar: todo menos la imagen PNG en memoria (p.png)
function packGen(){if(!S.gen)return null;const gen={...S.gen,per:{}};for(const [k,p] of Object.entries(S.gen.per||{})){const {png,...r}=p;gen.per[k]={...r,icon:p.icon==='png'?undefined:p.icon}}return structuredClone(gen)}
function packState(){const reps={};for(const F of S.files)if(F.rep)reps[F.path]={pal:F.rep.pal,idx:F.rep.idx,keyIdx:F.rep.keyIdx,by:F.rep.by};
  const gen=packGen();
  return {ops:structuredClone(S.ops),ex:{...S.ex},frames:{...S.frames},layout:structuredClone(S.layout),gen,reps,icx:structuredClone(S.icx||{}),stby:S.stby?{...S.stby}:null}}

function promptBS(o){return new Promise(res=>{

function setBase(id,name){S.base=id?{id,name}:null;try{if(id)localStorage.setItem('mediaskinhz-base',JSON.stringify({id,name,sig:sig()}));else localStorage.removeItem('mediaskinhz-base')}catch(_){}}

async function overwriteDesign(id){const p=await getPoint(id);if(!p)return false;

/* ============ diseños en archivo (.mskz) ============

/* ============ instalación automática con MortScript ============
   El ZIP lleva la carpeta Mediaskinhz/ para la raíz del USB:
     instalar.mscr · deshacer.mscr · archivos/<M1>/… (las imágenes nuevas) · originales/<M1>/… (las del backup)
   instalar.mscr: comprueba la carpeta de la radio, copia lo que hay ahora en la radio a antes-de-instalar/,
   copia las imágenes, comprueba el tamaño de cada una y, si alguna falla, devuelve la radio a como estaba.
   deshacer.mscr: vuelve a poner antes-de-instalar/ (o, si falta, originales/).
   MortScript solo lee scripts en ANSI (manual: «plain text, no Unicode!»), así que se escriben en Windows-1252.
   Sin probar todavía en el coche: sintaxis según el manual de MortScript 4. */
const ansi=s=>{s=s.replace(/\r?\n/g,'\r\n').replace(/…/g,'...').replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'");

const winP=p=>p.replace(/\//g,'\\');

const pbar=(i,n,w=20)=>{const k=Math.round(i/n*w);return '['+'#'.repeat(k)+'-'.repeat(w-k)+']  '+i+' de '+n};

  w(I+'rb2 = rb');
  w(I+'If ( DirExists( "\\Temp" ) )');
  w(I+'  Copy( rb, "\\Temp\\msz_reiniciar.exe", 1 )');
  w(I+'  If ( FileExists( "\\Temp\\msz_reiniciar.exe" ) )');
  w(I+'    rb2 = "\\Temp\\msz_reiniciar.exe"');
  w(I+'  EndIf');
  w(I+'EndIf')}

    if((i+1)%step===0||i===n-1)st('Paso 2 de 2 · Instalando y comprobando^NL^^NL^'+pbar(i+1,n))}

function mortUndo(R,items,id,when){

    w('If ( FileExists( src ) )');w(`  Copy( src, dst \\ ${qs(p)}, 1 )`);w(`  If ( FileSize( dst \\ ${qs(p)} ) <> FileSize( src ) )`);w('    fallos = fallos + 1');w(`    WriteFile( reg, "Falló: ${p.replace(/"/g,"'")}^NL^", 1 )`);w('  EndIf');
    w('Else');w('  faltan = faltan + 1');w(`  WriteFile( reg, "Sin copia para: ${p.replace(/"/g,"'")}^NL^", 1 )`);w('EndIf')}

/* Arranque desde el USB. En la MediaNav del autor el USB lleva ULC2_recovery.exe (MortRunner renombrado), que ejecuta
   ULC2_recovery.mscr, que abre MortScript con \MD\Medianav.mscr (\MD es el USB). Ese Medianav.mscr arrancaba MicomManager,
   cerraba la ventana activa, paraba el navegador y AppMain y abría Total Commander. Este lo sustituye: hace lo mismo al principio,
   pregunta si instalar el diseño del USB y, si no, abre Total Commander como siempre. ULC2_recovery.* no se tocan. */
const MEDIANAV_ORIG='Run("\\Storage Card\\System\\MicomManager.exe")\nSleep(20000)\nClose(ActiveWindow())\nSleep(5000)\nRun("\\Windows\\explorer.exe")\nKill("nngnavi.exe")\nSleep(5000)\nKill("AppMain.exe")\nSleep(5000)\nRun("\\MD\\TTCMD\\ttcmd.exe")\n';
function mortBoot(items,id,when,name,undo){
  const n=items.length,L=[];const w=x=>L.push(x),nm=String(name||'Mediaskinhz').replace(/"/g,"'"),act=undo?'Restaurar las imágenes originales':`Instalar el diseño «${nm}»`;
  w(`# Mediaskinhz · arranque con el USB · paquete ${id} (${when})`);
  w('# Sustituye a Medianav.mscr (lo abre ULC2_recovery.mscr). El de antes está en Mediaskinhz\\Medianav-original.mscr.');
  w('ErrorLevel( "off" )');
  w('# 1. Como el original: la radio tiene que tener MicomManager en marcha');
  w('Run( "\\Storage Card\\System\\MicomManager.exe" )');
  w('Sleep( 20000 )');
  w('Close( ActiveWindow() )');
  w('Sleep( 2000 )');
  w('usb = SystemPath( "ScriptPath" )');
  w('If ( not FileExists( usb \\ "Medianav.mscr" ) )');
  w('  usb = "\\MD"');
  w('EndIf');
  w('mz = usb \\ "Mediaskinhz"');
  w('inst = mz \\ "instalar.mscr"');
  w('ms = usb \\ "MortScript.exe"');
  w('rb = usb \\ "REINICIAR.exe"');
  w('If ( FileExists( inst ) and FileExists( ms ) )');
  w(`  If ( FileExists( mz \\ "instalado-${id}.txt" ) )`);
  w('    # Ya instalado (p. ej. la radio ha arrancado otra vez con el USB puesto): no se vuelve a instalar');
  w(`    If ( Question( "${undo?'Las imágenes originales ya están restauradas.':`El diseño «${nm}» ya está instalado.`}^NL^^NL^Si no vas a usar Total Commander, pulsa NO: la radio se reiniciará. Saca el USB cuando la pantalla se apague.^NL^^NL^SÍ: abrir Total Commander^NL^NO: reiniciar la radio", "Mediaskinhz", "YesNo" ) )`);
  w('      tc = 1');
  w('    Else');
  w('      tc = 0');
  w('      If ( FileExists( rb ) )');
  mortReboot(w,'        ');
  w('        Run( rb2 )');
  w('        Exit');
  w('      EndIf');
  w('      tc = 1');
  w('    EndIf');
  w('  Else');
  w(`    If ( Question( "${act}^NL^^NL^Imágenes: ${n}^NL^Paquete: ${when}^NL^^NL^Antes de instalar se guarda en el USB una copia de lo que hay en la radio. Si algo falla, la radio vuelve a su estado anterior. Tarda unos segundos; no apagues la radio.^NL^^NL^SÍ: ${undo?'restaurar':'instalar'} ahora^NL^NO: abrir Total Commander", "Mediaskinhz", "YesNo" ) )`);
  w('      # 2. Como el original antes de Total Commander: parar el navegador y AppMain para que las imágenes no estén en uso');
  w('      Kill( "nngnavi.exe" )');
  w('      Sleep( 3000 )');
  w('      Kill( "AppMain.exe" )');
  w('      Sleep( 5000 )');
  w('      Delete( mz \\ "resultado-ok.txt" )');
  w('      WriteFile( mz \\ "desde-arranque.tmp", "1" )');
  w('      RunWait( ms, inst )');
  w('      # Si ha terminado bien, el instalador ya está reiniciando la radio. Si no, se sigue a Total Commander');
  w('      If ( FileExists( mz \\ "resultado-ok.txt" ) )');
  w('        Exit');
  w('      EndIf');
  w('      Message( "La instalación no se ha completado. La radio se ha dejado como estaba.^NL^^NL^El detalle está en Mediaskinhz\\registro.txt, en el USB. Ahora se abre Total Commander.", "Mediaskinhz" )');
  w('    EndIf');

/* ============ lanzador del USB ============
   Para preparar un USB nuevo de una vez: guardas una vez el contenido de tu USB de siempre (ULC2_recovery, MortScript, Total Commander, REINICIAR…)
   y cada exportación automática lo lleva completo. Se guarda solo en este navegador (IndexedDB), nunca se sube a ningún sitio:
   el repositorio de la app es público y esos archivos (y la clave de tu equipo) no pueden ir en él. */
async function usbKit(){try{return await idb.get('usbkit')}catch(_){return null}}
function kitOrig(kit){return kit&&kit.orig?kit.orig:ansi(MEDIANAV_ORIG)}
// junta el lanzador con lo que genera Mediaskinhz; lo de Mediaskinhz manda si se repite un nombre
function withKit(ents,kit,boot){if(!kit||!kit.files)return ents;const have=new Set(ents.map(e=>e.name.toLowerCase()));
  const add=kit.files.filter(f=>!have.has(f.name.toLowerCase())&&!(boot&&f.name.toLowerCase()==='medianav.mscr')).map(f=>({name:f.name,data:f.data}));
  if(!boot&&kit.orig&&!have.has('medianav.mscr')&&!add.some(f=>f.name.toLowerCase()==='medianav.mscr'))add.push({name:'Medianav.mscr',data:kit.orig});return [...add,...ents]}
async function saveUsbKit(fl){const arr=[...fl];if(!arr.length)return false;let files=[];
  if(arr.length===1&&/\.rar$/i.test(arr[0].name)){toast('El navegador no puede abrir .rar: comprímelo como .zip o elige la carpeta del USB.',{ms:7000});return false}
  if(arr.length===1&&/\.zip$/i.test(arr[0].name)){try{files=(await readZip(await arr[0].arrayBuffer(),()=>true)).map(e=>({name:e.path.replace(/\\/g,'/'),data:new Uint8Array(e.buf)}))}catch(e){toast('No se ha podido leer el ZIP');return false}}
  else for(const f of arr)files.push({name:(f.webkitRelativePath||f.name).replace(/\\/g,'/'),data:new Uint8Array(await f.arrayBuffer())});
  files=files.filter(f=>f.name&&!f.name.endsWith('/'));
  // la raíz del USB es donde está MortScript.exe
  const ms=files.find(f=>/(^|\/)mortscript\.exe$/i.test(f.name));if(!ms){toast('No parece tu USB del lanzador: falta MortScript.exe',{ms:6000});return false}
  const pre=ms.name.slice(0,ms.name.length-'mortscript.exe'.length);
  files=files.filter(f=>f.name.toLowerCase().startsWith(pre.toLowerCase())).map(f=>({...f,name:f.name.slice(pre.length)}))
    .filter(f=>!/^(mediaskinhz|m1|m0|m1_inv|originales|restaurar)\//i.test(f.name)&&!/^(leeme\.txt|upgrade\.lgu)$/i.test(f.name)&&f.data.length<40e6);
  const mn=files.find(f=>f.name.toLowerCase()==='medianav.mscr');let orig=null;
  if(mn){const t=new TextDecoder('latin1').decode(mn.data);if(!/^#\s*Mediaskinhz/i.test(t))orig=mn.data}
  const size=files.reduce((a,f)=>a+f.data.length,0);
  try{await idb.set('usbkit',{t:Date.now(),files,orig,size,n:files.length})}catch(_){toast('No queda espacio en el navegador para guardar el USB');return false}
  toast(`Lanzador guardado: ${files.length} archivos (${fsz(size)})`);return true}
function pickUsbKit(after){openBS(`<h2>Guardar el contenido de tu USB</h2><p class="note">Elige tu USB de siempre (el que arranca Total Commander): un <b>ZIP</b> de todo su contenido o, en el ordenador, la <b>carpeta</b> del USB. Se guarda solo en este dispositivo; las imágenes y backups que haya en él no se guardan.</p>
  <div class="stack" style="gap:8px"><button class="btn wide" id="k-zip">Elegir un ZIP</button><button class="btn o wide" id="k-dir">Elegir la carpeta del USB</button><button class="btn o wide" id="k-x">Cancelar</button></div>`);

    try{await saveState(true)}catch(_){}
    // Se espera a que la versión nueva esté guardada entera (como mucho 20 s); tu diseño ya está guardado
    const ok=!SWOK||await new Promise(async res=>{const t=setTimeout(()=>res(false),20000);navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(t);res(true)},{once:true});
      try{const r=await navigator.serviceWorker.getRegistration();if(!r){clearTimeout(t);res(true);return}await r.update();if(!r.installing&&!r.waiting){clearTimeout(t);res(true)}}catch(_){clearTimeout(t);res(true)}});
    if(ok)location.reload();else{b.disabled=false;b.textContent='Actualizar';toast('La conexión va lenta. Se actualizará sola la próxima vez que abras la app')}};
}

boot();
</script>
