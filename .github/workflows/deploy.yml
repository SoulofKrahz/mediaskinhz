# Prueba la app y, si todo va bien, publica la carpeta site/ en Cloudflare Pages (rama main).
# Secretos en GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (token con permiso Account → Cloudflare Pages → Edit)
#   CLOUDFLARE_ACCOUNT_ID (ID de la cuenta de Cloudflare)
# Variable (pestaña Variables): CF_PROJECT = nombre del proyecto de Pages (mediaskinhz).
# Primera vez (si el proyecto de Pages no existe): npx wrangler pages project create mediaskinhz --production-branch=main
name: Publicar en Cloudflare Pages
on:
  push:
    branches: [main, pruebas]
    paths: ['site/**', 'src/**', 'tests/**', 'build.py', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  test:
    name: Prueba de humo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Service worker, versión y site/index.html al día con src/
        run: node tests/sw_check.mjs
      - name: Instalar Playwright (y Chromium solo si hace falta)
        timeout-minutes: 12
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.55.0
          if [ -x /usr/bin/google-chrome ]; then echo "PW_EXE=/usr/bin/google-chrome" >> "$GITHUB_ENV"; google-chrome --version; else npx playwright install --with-deps chromium; fi
      - name: Probar la app (móvil y PC)
        timeout-minutes: 8
        run: node tests/smoke.cjs
  deploy:
    name: Publicar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - name: Generar version.txt (para el aviso de versión nueva)
        run: grep -o "const VER='[^']*'" site/index.html | cut -d"'" -f2 > site/version.txt && cat site/version.txt && test -s site/version.txt
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true
